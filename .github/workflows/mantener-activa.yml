name: Mantener activa la base de la demo

# Supabase (plan gratis) pausa el proyecto si no recibe pedidos durante 7 días.
# Este workflow entra con el usuario técnico de la demo y lee los equipos cada
# 2 días, para que la base tenga actividad y la demo no se apague.
# Usa las mismas variables del repositorio que pages.yml
# (Settings > Secrets and variables > Actions > Variables).
# Las cuentas de demo son públicas a propósito (ver supabase/seed.sql).

on:
  schedule:
    - cron: '23 14 */2 * *'   # cada 2 días a las 14:23 UTC (11:23 de Argentina)
  workflow_dispatch:           # para correrlo a mano desde la pestaña Actions

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Entrar como técnico de la demo y leer los equipos
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # 1) Iniciar sesión con la cuenta pública de la demo
          token=$(curl -sf "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" \
            -d '{"email":"tecnico.demo@example.com","password":"PlantaDemo2026"}' \
            | jq -r '.access_token') || { echo "No se pudo iniciar sesión. ¿El proyecto está pausado en Supabase?"; exit 1; }

          # 2) Leer un equipo (consulta real a la base)
          codigo=$(curl -s -o respuesta.txt -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/equipos?select=codigo&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $token")
          echo "Respuesta de Supabase: $codigo"
          cat respuesta.txt; echo

          # Si algo falla, el workflow queda en rojo y GitHub te avisa por mail.
          [ "$codigo" = "200" ] || { echo "La consulta no funcionó. Revisá el proyecto en Supabase."; exit 1; }
